<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/>
      <stop offset="1" stop-color="#0d0f14"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff453a"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#bg)"/>
  <circle cx="100" cy="100" r="62" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="12"/>
  <!-- Remaining time: three quarters of the ring, starting at 12 o'clock -->
  <circle cx="100" cy="100" r="62" fill="none" stroke="url(#arc)" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="292 390" transform="rotate(-90 100 100)"/>
  <text x="100" y="110" text-anchor="middle" fill="#ffffff"
        font-family="SF Mono, Menlo, Consolas, monospace" font-size="30" font-weight="700">25:00</text>
</svg>
